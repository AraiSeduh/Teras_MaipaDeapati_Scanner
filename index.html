
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58151d">
  <title>Maipa Deapati — Ticket Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --maroon: #58151d;
      --maroon-dark: #351016;
      --gold: #e7c77a;
      --paper: #fffaf2;
      --ink: #251719;
      --muted: #78696a;
      --green: #176b42;
      --red: #a32632;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--ink);
      background:
        radial-gradient(circle at top, #7b3038 0, var(--maroon-dark) 68%);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 18px 60px #0005;
    }

    .header {
      padding: 25px 20px 22px;
      text-align: center;
      color: white;
      background: var(--maroon);
      border-bottom: 3px solid var(--gold);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #f0dfe0;
      font-size: 13px;
    }

    .content {
      padding: 20px;
    }

    .status-line {
      display: flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #b5a6a7;
    }

    .dot.ready {
      background: #238953;
      box-shadow: 0 0 0 4px #23895320;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border: 1px solid #e5d7d3;
      border-radius: 16px;
      background: #f5eeea;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
    }

    #reader__dashboard_section_csr button {
      padding: 10px 14px;
      margin: 5px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: var(--maroon);
      font-weight: 700;
      cursor: pointer;
    }

    .hint {
      margin: 13px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 17px;
      border: 1px solid #ded1ca;
      border-radius: 14px;
      background: white;
    }

    .result.show {
      display: block;
    }

    .result.success {
      border-color: #9acbad;
      background: #effaf2;
    }

    .result.error {
      border-color: #e3a9ad;
      background: #fff1f1;
    }

    .result-title {
      margin: 0 0 7px;
      font-size: 18px;
      font-weight: 800;
    }

    .result.success .result-title {
      color: var(--green);
    }

    .result.error .result-title {
      color: var(--red);
    }

    .result-message {
      margin: 0 0 13px;
      font-size: 13px;
      line-height: 1.5;
    }

    .details {
      display: grid;
      grid-template-columns: 95px 1fr;
      gap: 8px 12px;
      padding-top: 12px;
      border-top: 1px solid #d9d0cc;
      font-size: 13px;
    }

    .detail-label {
      color: var(--muted);
    }

    .detail-value {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .scan-again {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 0;
      border-radius: 11px;
      color: white;
      background: var(--maroon);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .scan-again.show {
      display: block;
    }

    .footer {
      padding: 15px 20px;
      border-top: 1px solid #eaded7;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .footer strong {
      color: var(--maroon);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">Teater Musikal</p>
      <h1>Maipa Deapati</h1>
      <p class="subtitle">Official Ticket Scanner</p>
    </header>

    <section class="content">
      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span id="scannerStatus">Menyiapkan kamera...</span>
      </div>

      <div id="reader"></div>

      <p class="hint" id="scanHint">
        Arahkan kamera ke QR tiket. Validasi dilakukan otomatis
        setelah QR terbaca.
      </p>

      <section class="result" id="result" aria-live="polite">
        <h2 class="result-title" id="resultTitle">Hasil validasi</h2>
        <p class="result-message" id="resultMessage"></p>

        <div class="details" id="ticketDetails">
          <span class="detail-label">Nama</span>
          <span class="detail-value" id="ticketName">—</span>

          <span class="detail-label">Kategori</span>
          <span class="detail-value" id="ticketCategory">—</span>

          <span class="detail-label">Sesi</span>
          <span class="detail-value" id="ticketSession">—</span>

          <span class="detail-label">Kursi</span>
          <span class="detail-value" id="ticketSeat">—</span>

          <span class="detail-label">Check-in</span>
          <span class="detail-value" id="ticketTime">—</span>
        </div>
      </section>

      <button class="scan-again" id="scanAgain" type="button">
        Scan Tiket Berikutnya
      </button>
    </section>

    <footer class="footer">
      <strong>MAIPA DEAPATI</strong><br>
      Pastikan status tiket berhasil sebelum penonton memasuki area acara.
    </footer>
  </main>

  <script>
    "use strict";

    // URL deployment Apps Script yang diberikan.
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyGNIAQk0W5LxvhfZf0dC9zaRdQL29KG1nE7Xtpe_1ghx_vifxRN8bzVjbQdIM0Gonr/exec";

    const scannerStatus = document.getElementById("scannerStatus");
    const statusDot = document.getElementById("statusDot");
    const resultBox = document.getElementById("result");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const scanAgainButton = document.getElementById("scanAgain");
    const scanHint = document.getElementById("scanHint");

    let scanner = null;
    let isProcessing = false;
    let isScannerRunning = false;
    let lastToken = "";
    let lastScanAt = 0;

    function setScannerStatus(message, ready = false) {
      scannerStatus.textContent = message;
      statusDot.classList.toggle("ready", ready);
    }

    function safeText(value) {
      return value === undefined || value === null || value === ""
        ? "—"
        : String(value);
    }

    function showResult(data) {
      const success = data.success === true;
      const alreadyUsed = data.alreadyUsed === true;

      resultBox.className =
        "result show " + (success ? "success" : "error");

      if (!success) {
        resultTitle.textContent = "TIKET TIDAK VALID";
      } else if (alreadyUsed) {
        resultTitle.textContent = "TIKET SUDAH DIGUNAKAN";
      } else {
        resultTitle.textContent = "CHECK-IN BERHASIL";
      }

      resultMessage.textContent =
        data.message || "Tidak ada keterangan dari server.";

      document.getElementById("ticketName").textContent =
        safeText(data.name);

      document.getElementById("ticketCategory").textContent =
        safeText(data.category);

      document.getElementById("ticketSession").textContent =
        safeText(data.session);

      document.getElementById("ticketSeat").textContent =
        safeText(data.seat);

      document.getElementById("ticketTime").textContent =
        formatTime(data.checkedInAt);

      scanAgainButton.classList.add("show");
      scanHint.textContent =
        "Hasil pemindaian sudah diterima. Tekan tombol di bawah untuk scan berikutnya.";
    }

    function formatTime(value) {
      if (!value) return "—";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("id-ID", {
        dateStyle: "medium",
        timeStyle: "medium",
        timeZone: "Asia/Jakarta"
      });
    }

    function validateToken(token) {
      return /^[a-f0-9]{40}$/i.test(String(token || "").trim());
    }

    // JSONP: avoids browser CORS restrictions for this Apps Script endpoint.
    // The callback name is a fixed JavaScript identifier accepted by Code.gs.
    function callCheckInAPI(token) {
      return new Promise((resolve, reject) => {
        const callbackName = "maipaCheckInCallback";
        const script = document.createElement("script");

        let finished = false;

        function cleanup() {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[callbackName];
          } catch (_) {
            window[callbackName] = undefined;
          }

          clearTimeout(timeoutId);
        }

        function finish(callback, value) {
          if (finished) return;
          finished = true;
          cleanup();
          callback(value);
        }

        window[callbackName] = function (data) {
          finish(resolve, data);
        };

        script.onerror = function () {
          finish(
            reject,
            new Error(
              "Browser gagal memuat respons Apps Script. " +
              "Periksa URL deployment dan akses web app."
            )
          );
        };

        const timeoutId = setTimeout(() => {
          finish(
            reject,
            new Error(
              "Server tidak merespons. Periksa deployment Apps Script."
            )
          );
        }, 15000);

        script.src =
          API_URL +
          "?action=checkin" +
          "&token=" + encodeURIComponent(token) +
          "&callback=" + encodeURIComponent(callbackName) +
          "&_=" + Date.now();

        document.body.appendChild(script);
      });
    }

    async function onQrDetected(decodedText) {
      const token = String(decodedText || "").trim();
      const now = Date.now();

      // Prevent duplicate callbacks from the same QR while processing.
      if (isProcessing) return;

      // Avoid immediately reprocessing the same QR after the scanner resumes.
      if (token === lastToken && now - lastScanAt < 5000) return;

      isProcessing = true;
      lastToken = token;
      lastScanAt = now;

      setScannerStatus("QR terbaca. Memvalidasi tiket...", false);

      try {
        // Stop camera scanning while the server validates this QR.
        await stopScanner();

        if (!validateToken(token)) {
          showResult({
            success: false,
            alreadyUsed: false,
            message: "Format QR tidak dikenali sebagai QR tiket Maipa Deapati."
          });
          setScannerStatus("QR tidak valid.", false);
          return;
        }

        const response = await callCheckInAPI(token);

        if (!response || typeof response.success !== "boolean") {
          throw new Error("Format respons server tidak dikenali.");
        }

        showResult(response);

        if (response.success && !response.alreadyUsed) {
          setScannerStatus("Tiket valid. Check-in berhasil.", true);
        } else if (response.alreadyUsed) {
          setScannerStatus("Tiket sudah pernah digunakan.", false);
        } else {
          setScannerStatus("Validasi gagal.", false);
        }

      } catch (error) {
        showResult({
          success: false,
          alreadyUsed: false,
          message: error && error.message
            ? error.message
            : "Gagal memvalidasi QR."
        });

        setScannerStatus("Gagal menghubungi server.", false);

      } finally {
        scanAgainButton.classList.add("show");
      }
    }

    async function startScanner() {
      resultBox.className = "result";
      scanAgainButton.classList.remove("show");
      scanHint.textContent =
        "Arahkan kamera ke QR tiket. Validasi dilakukan otomatis setelah QR terbaca.";

      setScannerStatus("Memulai kamera...", false);

      try {
        if (!scanner) {
          scanner = new Html5Qrcode("reader");
        }

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: function (viewfinderWidth, viewfinderHeight) {
              const size = Math.floor(
                Math.min(viewfinderWidth, viewfinderHeight) * 0.72
              );

              return { width: size, height: size };
            },
            aspectRatio: 1.0
          },
          onQrDetected,
          function () {
            // Ignore frames that do not contain a QR code.
          }
        );

        isScannerRunning = true;
        setScannerStatus("Kamera aktif. Siap scan QR.", true);

      } catch (error) {
        isScannerRunning = false;
        setScannerStatus(
          "Kamera gagal dibuka. Izinkan akses kamera dan gunakan HTTPS.",
          false
        );

        resultBox.className = "result show error";
        resultTitle.textContent = "KAMERA TIDAK TERSEDIA";
        resultMessage.textContent =
          error && error.message
            ? error.message
            : "Pastikan browser mendukung kamera dan izin kamera sudah diberikan.";
        scanAgainButton.classList.add("show");
      }
    }

    async function stopScanner() {
      if (!scanner || !isScannerRunning) return;

      try {
        await scanner.stop();
      } catch (_) {
        // Scanner may already be stopped.
      }

      isScannerRunning = false;
    }

    scanAgainButton.addEventListener("click", async function () {
      if (isProcessing) {
        isProcessing = false;
      }

      lastToken = "";
      lastScanAt = 0;

      await startScanner();
    });

    // Start scanning automatically when the page opens.
    window.addEventListener("load", startScanner);
  </script>
</body>
</html>
