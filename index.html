
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maipa Deapati — Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--wine:#6e090d;--gold:#e5b34b;--cream:#e0cba9}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f0e8;font-family:Arial,sans-serif;color:#241714}
    .wrap{max-width:680px;margin:0 auto;padding:16px}
    .hero{background:linear-gradient(120deg,#6b090e,#9e2e17);color:#fff4dc;padding:20px;border-radius:16px;margin-bottom:16px}
    h1{font-size:23px;margin:0 0 6px}
    .muted{font-size:13px;opacity:.85;line-height:1.5}
    .panel{background:white;padding:16px;border-radius:16px;box-shadow:0 5px 22px #321a1012}
    button,input{width:100%;padding:13px;border:0;border-radius:10px;font-size:15px;margin-top:12px}
    button{background:var(--wine);color:white;font-weight:bold;cursor:pointer}
    button.secondary{background:#eee3d3;color:#321b16}
    button:disabled{opacity:.5}
    #reader{width:100%;margin-top:14px;overflow:hidden;border-radius:12px}
    #result{display:none;margin-top:16px;border:2px solid #ddd;border-radius:14px;padding:16px}
    #result.valid{border-color:#21834a;background:#effaf2}
    #result.used{border-color:#b7791f;background:#fff8e6}
    #result.invalid{border-color:#b42318;background:#fff0ef}
    #result h2{margin:0 0 10px;font-size:20px}
    .detail{font-size:15px;line-height:1.8}
    .small{font-size:12px;color:#65564e;line-height:1.5;margin-top:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Maipa Deapati — Ticket Scanner</h1>
    <div class="muted">Arahkan kamera ke QR e-ticket untuk memvalidasi tiket dan check-in.</div>
  </div>

  <div class="panel">
    <button id="startBtn" type="button">MULAI SCAN</button>
    <button id="stopBtn" class="secondary" type="button">STOP KAMERA</button>
    <div id="reader"></div>
    <div id="result" role="status" aria-live="polite"></div>
    <div class="small">Gunakan halaman HTTPS dan izinkan akses kamera. Scanner ini terhubung ke Google Apps Script melalui endpoint JSONP.</div>
  </div>
</div>

<script>
'use strict';

// GANTI dengan URL Web App Google Apps Script yang berakhiran /exec.
const WEB_APP_URL='PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';

let scanner=null,scanning=false,processing=false;
const $=id=>document.getElementById(id);

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function showResult(kind,title,ticket){
  const el=$('result');
  el.className=kind;
  el.style.display='block';

  let details='';
  if(ticket&&(ticket.name||ticket.seatLabel)){
    details='<div class="detail"><b>Nama:</b> '+esc(ticket.name||'-')+
      '<br><b>Sesi:</b> '+esc(ticket.session||'-')+
      '<br><b>Kategori:</b> '+esc(ticket.category||'-')+
      '<br><b>Bangku:</b> '+esc(ticket.seatLabel||'-')+
      (ticket.checkInTime?'<br><b>Waktu:</b> '+esc(ticket.checkInTime):'')+
      '</div>';
  }

  el.innerHTML='<h2>'+esc(title)+'</h2>'+details;
}

function checkIn(token){
  return new Promise((resolve,reject)=>{
    if(!WEB_APP_URL.startsWith('https://script.google.com/macros/s/')||WEB_APP_URL.includes('PASTE_URL')){
      reject(Error('Isi WEB_APP_URL di index.html dengan URL Web App Apps Script.'));
      return;
    }

    const cb='maipaCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script=document.createElement('script');
    let finished=false;

    const cleanup=()=>{
      if(finished)return;
      finished=true;
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
      clearTimeout(timer);
    };

    const timer=setTimeout(()=>{
      cleanup();
      reject(Error('Server tidak merespons. Periksa URL Web App dan koneksi internet.'));
    },20000);

    window[cb]=data=>{
      cleanup();
      resolve(data);
    };

    script.onerror=()=>{
      cleanup();
      reject(Error('Tidak dapat menghubungi endpoint Apps Script.'));
    };

    script.src=WEB_APP_URL+
      '?action=checkin&token='+encodeURIComponent(token)+
      '&callback='+encodeURIComponent(cb)+
      '&_='+Date.now();

    document.body.appendChild(script);
  });
}

async function startScanner(){
  if(scanning)return;
  $('result').style.display='none';

  if(!window.Html5Qrcode){
    showResult('invalid','Library scanner gagal dimuat. Periksa koneksi internet.');
    return;
  }

  scanner=new Html5Qrcode('reader');

  try{
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:250}},
      onScanSuccess,
      ()=>{}
    );
    scanning=true;
    $('startBtn').disabled=true;
  }catch(e){
    showResult('invalid','Kamera tidak bisa dibuka. Izinkan akses kamera, gunakan HTTPS, dan buka halaman di browser utama.');
  }
}

async function stopScanner(){
  if(scanner&&scanning){
    try{await scanner.stop()}catch(e){}
    try{await scanner.clear()}catch(e){}
  }
  scanning=false;
  $('startBtn').disabled=false;
}

async function onScanSuccess(decodedText){
  if(processing)return;
  processing=true;
  await stopScanner();
  showResult('used','MEMPROSES TIKET...');

  try{
    const result=await checkIn(decodedText);

    if(result.status==='VALID'&&result.success){
      showResult('valid',result.message||'CHECK-IN BERHASIL',result);
    }else if(result.status==='USED'){
      showResult('used',result.message||'TIKET SUDAH DIGUNAKAN',result);
    }else{
      showResult('invalid',result.message||'TIKET TIDAK VALID',result);
    }
  }catch(e){
    showResult('invalid',e.message||'Server tidak dapat dihubungi.');
  }finally{
    processing=false;
  }
}

$('startBtn').addEventListener('click',startScanner);
$('stopBtn').addEventListener('click',stopScanner);
</script>
</body>
</html>
