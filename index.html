
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maipa Deapati — Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --wine: #711c2b;
      --red: #a72b40;
      --bg: #f8f1ef;
      --ink: #31141b;
      --line: #ead8d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 12px 35px;
      background: var(--bg); color: var(--ink);
      font-family: Arial, sans-serif;
    }
    .wrap { max-width: 620px; margin: auto; }
    header {
      padding: 25px; border-radius: 20px;
      background: linear-gradient(135deg, #541421, #a72b40);
      color: white; margin-bottom: 18px;
    }
    header small { letter-spacing: 2px; font-weight: bold; }
    h1 { margin: 10px 0; font-size: 27px; }
    header p { margin: 0; line-height: 1.5; opacity: .9; }
    .panel {
      padding: 20px; background: white;
      border: 1px solid var(--line); border-radius: 18px;
      margin-bottom: 16px;
    }
    h2 { font-size: 18px; margin: 0 0 15px; }
    #reader { width: 100%; overflow: hidden; border-radius: 12px; }
    input, button {
      width: 100%; padding: 13px;
      border-radius: 10px; font: inherit;
    }
    input { border: 1px solid #dfc9cc; margin: 7px 0 10px; }
    button {
      border: 0; background: var(--wine); color: white;
      font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    button.secondary { background: #f7e9e9; color: var(--wine); }
    button:disabled { opacity: .55; }
    #result {
      display: none; padding: 15px; border-radius: 12px;
      line-height: 1.65; overflow-wrap: anywhere;
    }
    #result.success { display: block; background: #eaf7ed; color: #205e34; }
    #result.error { display: block; background: #fff0f0; color: #942338; }
    #result.info { display: block; background: #fff7e6; color: #76530b; }
    .muted { font-size: 12px; color: #806c70; line-height: 1.5; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <small>OFFICIAL TICKET CHECK-IN</small>
    <h1>Maipa Deapati</h1>
    <p>Scan QR tiket untuk memvalidasi dan mencatat check-in penonton.</p>
  </header>

  <section class="panel">
    <h2>Scan QR Tiket</h2>
    <div id="reader"></div>
    <p class="muted">Izinkan akses kamera saat diminta browser. Gunakan HTTPS untuk akses kamera.</p>
    <button id="startBtn">Mulai Kamera</button>
    <button id="stopBtn" class="secondary">Matikan Kamera</button>
  </section>

  <section class="panel">
    <h2>Input Token Manual</h2>
    <input id="tokenInput" placeholder="Tempel token tiket di sini">
    <button id="checkBtn">Validasi Tiket</button>
    <div id="result" role="status"></div>
  </section>
</div>

<script>
  // GANTI dengan URL Web App Apps Script yang sudah di-deploy.
  const API_URL = "PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI";

  const $ = id => document.getElementById(id);
  let scanner = null;
  let scanning = false;
  let processing = false;

  function showResult(message, type) {
    $("result").textContent = message;
    $("result").className = type;
  }

  function checkToken(token) {
    token = String(token || "").trim();

    if (!token) {
      showResult("Token tiket belum diisi.", "error");
      return;
    }
    if (!/^[a-f0-9]{40}$/i.test(token)) {
      showResult("Format token tidak valid. Pastikan QR berasal dari tiket resmi.", "error");
      return;
    }
    if (API_URL.includes("PASTE_URL")) {
      showResult("URL Apps Script belum dipasang. Isi API_URL dengan URL deployment /exec.", "error");
      return;
    }
    if (processing) return;

    processing = true;
    $("checkBtn").disabled = true;
    showResult("Memeriksa tiket...", "info");

    const callbackName = "MaipaScannerCallback_" + Date.now();

    const cleanup = () => {
      processing = false;
      $("checkBtn").disabled = false;
      try { delete window[callbackName]; } catch (_) {}
      if (script && script.parentNode) script.parentNode.removeChild(script);
    };

    const script = document.createElement("script");

    window[callbackName] = data => {
      cleanup();

      if (data.success) {
        showResult(
          "CHECK-IN BERHASIL\n" +
          "Nama: " + data.name + "\n" +
          "Kategori: " + data.category + "\n" +
          "Sesi: " + data.session + "\n" +
          "Seat: " + data.seat + "\n" +
          "Waktu: " + (data.checkedInAt || "-"),
          "success"
        );
        $("tokenInput").value = "";
      } else if (data.alreadyUsed) {
        showResult(
          "TIKET SUDAH DIGUNAKAN\n" +
          "Nama: " + (data.name || "-") + "\n" +
          "Sesi: " + (data.session || "-") + "\n" +
          "Seat: " + (data.seat || "-") + "\n" +
          data.message,
          "error"
        );
      } else {
        showResult(data.message || "Tiket tidak valid.", "error");
      }
    };

    script.onerror = () => {
      cleanup();
      showResult(
        "Koneksi gagal. Periksa URL /exec, izin deployment, koneksi internet, dan versi deployment Apps Script.",
        "error"
      );
    };

    script.src = API_URL +
      "?action=checkin" +
      "&callback=" + encodeURIComponent(callbackName) +
      "&token=" + encodeURIComponent(token) +
      "&_=" + Date.now();

    document.body.appendChild(script);
  }

  $("checkBtn").addEventListener("click", () => checkToken($("tokenInput").value));
  $("tokenInput").addEventListener("keydown", e => {
    if (e.key === "Enter") checkToken($("tokenInput").value);
  });

  $("startBtn").addEventListener("click", async () => {
    if (scanning) return;

    try {
      if (!window.Html5Qrcode) {
        throw new Error("Library kamera gagal dimuat. Periksa koneksi internet.");
      }

      scanner = new Html5Qrcode("reader");
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        decodedText => {
          if (!processing) checkToken(decodedText);
        },
        () => {}
      );

      scanning = true;
      showResult("Kamera aktif. Arahkan ke QR tiket.", "info");
    } catch (error) {
      showResult("Kamera gagal dibuka: " + error.message, "error");
    }
  });

  $("stopBtn").addEventListener("click", async () => {
    if (!scanner || !scanning) return;

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (_) {}

    scanner = null;
    scanning = false;
    showResult("Kamera dimatikan.", "info");
  });
</script>
</body>
</html>
